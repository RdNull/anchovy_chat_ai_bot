# Rendered by `envsubst` in deploy-k8s.sh, like manifests/secrets.yaml — see that file's
# header for what a value may safely contain (printable characters, no backslashes).
#
# The keys are the settings names the process reads, so the pod's environment looks like any
# other; only the GitHub secrets behind them are blackbox-specific. DATABASE_URL is the
# read-only Mongo user (host `mongo.default.svc.cluster.local`), and OPENROUTER_API_KEY is a
# separate low-cap key used only to embed search queries: neither is the bot's credential.
apiVersion: v1
kind: Secret
metadata:
  name: blackbox-secrets
  namespace: blackbox
stringData:
  BLACKBOX_MCP_ACCESS_TOKEN: "${BLACKBOX_MCP_ACCESS_TOKEN}"
  DATABASE_URL: "${BLACKBOX_DATABASE_URL}"
  OPENROUTER_API_KEY: "${BLACKBOX_OPENROUTER_API_KEY}"
