# Helm values for cert-manager, installed by scripts/cluster-bootstrap.sh into namespace
# `cert-manager`. It issues the TLS certificates Traefik serves; see traefik-values.yaml for
# why issuance is not Traefik's job.

crds:
  enabled: true
  # Keep the CRDs, and with them every Certificate, if the release is ever uninstalled.
  keep: true

# Requests only, sized for the old 2Gi node's ~390Mi of spare headroom (the node is 4Gi now; these are small enough to stay as they are).
resources:
  requests:
    cpu: 10m
    memory: 32Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
