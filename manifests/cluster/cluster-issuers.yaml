# Let's Encrypt over HTTP-01, applied by scripts/cluster-bootstrap.sh once cert-manager is up.
#
# Staging first, until the whole path works end to end: production has issuance rate limits
# that are easy to burn through while iterating on an Ingress. Switching is the
# `cert-manager.io/cluster-issuer` annotation in manifests/blackbox/ingress.yaml.
#
# `ingressClassName: traefik` is load-bearing: the solver creates a temporary Ingress for
# `/.well-known/acme-challenge/<token>`, and without a class nothing claims it, so the
# challenge is never served and the certificate never issues.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
