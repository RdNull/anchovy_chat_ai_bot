apiVersion: v1
kind: ConfigMap
metadata:
  name: bot-configmap
data:
  ENABLE_DEBUG_CHARACTER: 'false'
  BOT_NICKNAME: "${BOT_NICKNAME}"
  DATABASE_NAME: "${DATABASE_NAME}"
  ALLOWED_CHAT_IDS: "${ALLOWED_CHAT_IDS}"
  ALLOWED_USER_IDS: "${ALLOWED_USER_IDS}"
  AI_TIMEOUT: "${AI_TIMEOUT}"
  CHAT_RATE_LIMIT: "${CHAT_RATE_LIMIT}"
  EMBEDDINGS_SEARCH_MAX_SIZE: "${EMBEDDINGS_SEARCH_MAX_SIZE}"
  MESSAGES_EMBEDDINGS_MAX_SIZE: "${MESSAGES_EMBEDDINGS_MAX_SIZE}"
  MESSAGES_MEMORY_MAX_SIZE: "${MESSAGES_MEMORY_MAX_SIZE}"
  MEMORY_TRIGGER_SIZE: "${MEMORY_TRIGGER_SIZE}"
  EMBEDDINGS_TRIGGER_SIZE: "${EMBEDDINGS_TRIGGER_SIZE}"
  EMBEDDINGS_MIN_SIZE: "${EMBEDDINGS_MIN_SIZE}"
  LAST_MESSAGES_SIZE: "${LAST_MESSAGES_SIZE}"
  LAST_MESSAGES_MIN_SIZE: "${LAST_MESSAGES_MIN_SIZE}"
  WEB_SEARCH_RATE_LIMIT: "${WEB_SEARCH_RATE_LIMIT}"
  WEB_SEARCH_TIMEOUT: "${WEB_SEARCH_TIMEOUT}"
  MEDIA_PROCESSING_STALE_MINUTES: "${MEDIA_PROCESSING_STALE_MINUTES}"
  ENABLE_MEMORY_PROCESSING: "${ENABLE_MEMORY_PROCESSING}"
  MEMORY_RETENTION_DAYS: "${MEMORY_RETENTION_DAYS}"
  ENABLE_MEMORY_DECAY: "${ENABLE_MEMORY_DECAY}"
  TRAITS_KEEP: "${TRAITS_KEEP}"
  RECENT_KEEP: "${RECENT_KEEP}"
  RECENT_MAX_CYCLES: "${RECENT_MAX_CYCLES}"
  TOPICS_KEEP: "${TOPICS_KEEP}"
  QUESTIONS_KEEP: "${QUESTIONS_KEEP}"
  JOKES_KEEP: "${JOKES_KEEP}"
  ENABLE_STICKER_REPLIES: "${ENABLE_STICKER_REPLIES}"
  STICKER_PROBE_LIMIT: "${STICKER_PROBE_LIMIT}"
  STICKER_SEARCH_LIMIT: "${STICKER_SEARCH_LIMIT}"
  STICKER_SCORE_THRESHOLD: "${STICKER_SCORE_THRESHOLD}"
  STICKER_RECENT_EXCLUDE: "${STICKER_RECENT_EXCLUDE}"
  INITIATIVE_CHECKS_ENABLED: "${INITIATIVE_CHECKS_ENABLED}"
  INITIATIVE_ENABLED: "${INITIATIVE_ENABLED}"
  INITIATIVE_TRIGGER_SIZE: "${INITIATIVE_TRIGGER_SIZE}"
  INITIATIVE_RUN_MESSAGES_MAX_SIZE: "${INITIATIVE_RUN_MESSAGES_MAX_SIZE}"
  INITIATIVE_CONTEXT_SIZE: "${INITIATIVE_CONTEXT_SIZE}"
  INITIATIVE_GAP_MINUTES: "${INITIATIVE_GAP_MINUTES}"
  INITIATIVE_SCORE_THRESHOLD: "${INITIATIVE_SCORE_THRESHOLD}"
  INITIATIVE_COOLDOWN_MINUTES: "${INITIATIVE_COOLDOWN_MINUTES}"
  INITIATIVE_MIN_GAP_MESSAGES: "${INITIATIVE_MIN_GAP_MESSAGES}"
  INITIATIVE_DAILY_LIMIT: "${INITIATIVE_DAILY_LIMIT}"
  RESPOND_MEDIA_PROCESSING_POLLING_TIMEOUT: "${RESPOND_MEDIA_PROCESSING_POLLING_TIMEOUT}"
  OPENROUTER_API_URL: "${OPENROUTER_API_URL}"
  EMBEDDINGS_MODEL_NAME: "${EMBEDDINGS_MODEL_NAME}"
  EMBEDDINGS_VECTOR_SIZE: "${EMBEDDINGS_VECTOR_SIZE}"
  LANGSMITH_TRACING: "true"
  LANGSMITH_ENDPOINT: "${LANGSMITH_ENDPOINT}"
  LANGSMITH_PROJECT: "${LANGSMITH_PROJECT}"