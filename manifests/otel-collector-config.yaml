# The OpenTelemetry Collector's own config schema — not a Kubernetes manifest (no apiVersion,
# no kind). deploy-k8s.sh turns this into the `otel-collector-config` ConfigMap with
# `kubectl create configmap --from-file`, which reads it as raw bytes: no envsubst pass touches
# it, so the collector's own env-var-expansion syntax below is never at risk of collision with
# an envsubst placeholder — not that it could collide anyway, since envsubst only recognizes
# bare names and that syntax's colon would keep it from matching regardless.
extensions:
  file_storage:
    directory: /var/lib/otelcol/storage
  # Default endpoint is localhost:13133 — loopback-only inside the container network
  # namespace. kubelet's probes hit the pod IP, not localhost, so the default leaves both
  # probes permanently connection-refused despite the collector itself being healthy.
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  file_log:
    # Scoped to the two namespaces deploy-k8s.sh actually applies into, not to a list of
    # service names: every project workload lands in `default` or `blackbox`, and cluster
    # infrastructure (calico, coredns, csi-linode, konnectivity-agent, kube-proxy,
    # metrics-server, traefik, cert-manager) does not. A pod glob would need editing every
    # time a service is added; this glob needs editing only if a third project namespace
    # is introduced, which is already documented as a deliberate move (see
    # .claude/rules/deployment.md on blackbox's own namespace). Unscoped, kube-system
    # chatter alone was measured at ~80% of ingested volume, mostly konnectivity-agent.
    include:
      - /var/log/pods/default_*/*/*.log
      - /var/log/pods/blackbox_*/*/*.log
    # Without this the collector reads its own log file, and any export error it logs
    # becomes a new line to export. Must match this DaemonSet's pod-name prefix exactly.
    exclude: [/var/log/pods/default_otel-collector-*/*/*.log]
    # Nothing appears until something new is logged — deliberate, so a first start does not
    # ship whatever backlog happens to be sitting on the node. Use `beginning` only for a
    # one-off capture of the node's current buffer.
    start_at: end
    include_file_path: true
    storage: file_storage
    operators:
      # On-disk CRI logs are `<rfc3339> stdout F <message>`, not JSON. This operator parses
      # that, handles the docker variant, reassembles split multiline records, and — with
      # add_metadata_from_filepath — populates the k8s.pod.name / k8s.namespace.name that
      # pod_association below keys on. A hand-rolled regex_parser + recombine pair is the
      # wrong turn here.
      - type: container
        add_metadata_from_filepath: true

      # Scoped to this project's own containers, NOT applied to every JSON line on the node.
      # mongod 4.4+ logs structured JSON whose per-message `attr` object would mint 100+
      # permanent `attributes.attr.*` columns against Axiom's 256-field budget, and would
      # feed `"s":"I"` into severity parsing. `container` has already set k8s.container.name
      # from the file path by this point, which is what makes the guard cheap.
      - type: json_parser
        if: 'resource["k8s.container.name"] == "anchovy-bot-deployment" or resource["k8s.container.name"] == "blackbox" or resource["k8s.container.name"] == "dns-sync"'
        parse_from: body
        parse_to: attributes
        # A non-JSON line — a pydantic UserWarning written straight to stderr by the
        # `warnings` module, say — must pass through with `body` intact. `_quiet` because
        # the alternative is the collector logging about every such line.
        on_error: send_quiet
        parse_ints: true
        severity:
          parse_from: attributes.level
          # Kept as an attribute as well as lifted to SeverityText, so a query works whether
          # or not Axiom surfaces severity as its own column for this dataset kind.
          preserve_to: attributes.level

      # `parse_to: attributes` merges the parsed map into attributes and leaves the raw JSON
      # in `body`. Moving `msg` over it makes `body` the constant human-readable sentence
      # again, so `summarize count() by body` groups, and drops the duplicated payload.
      - type: move
        if: 'attributes?.msg != nil'
        from: attributes.msg
        to: body

processors:
  memory_limiter:
    check_interval: 1s
    # Below the container's 192Mi limit, so the collector sheds load itself before the
    # kernel OOM-kills it.
    limit_mib: 140
    spike_limit_mib: 30
  k8s_attributes:
    auth_type: serviceAccount
    # Restricts the informer to this node's own pods. On a one-node cluster this changes
    # nothing about correctness, but at a 64Mi request it is resource use worth not paying
    # for, and it is what keeps a future multi-node cluster from making every collector
    # replica watch every pod.
    filter:
      node_from_env_var: KUBE_NODE_NAME
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.container.name
        - k8s.deployment.name
        - k8s.statefulset.name
        # Unlike k8s.deployment.name (Pod -> ReplicaSet -> Deployment, resolved by reading the
        # ReplicaSet object), this is a name-only heuristic on the owning Job's own name string
        # — matching the `<cronjob-name>-<8-digit-timestamp>` pattern the CronJob controller
        # gives its Jobs. No Job/CronJob API read, so no RBAC beyond pods/namespaces/replicasets
        # is needed; verified live by creating a Job named to match that pattern and confirming
        # k8s.cronjob.name resolved with no batch/jobs/cronjobs grant present. The corollary: a
        # manually-triggered run whose Job name doesn't match the pattern — e.g. the documented
        # `kubectl create job --from=cronjob/dns-sync dns-sync-manual` in the root CLAUDE.md —
        # resolves to nothing, and the dashboard's service grouping falls back to k8s.pod.name
        # for that one run. Scheduled runs are unaffected.
        - k8s.cronjob.name
        - k8s.node.name
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.name
          - from: resource_attribute
            name: k8s.namespace.name
  batch:
    timeout: 5s
    send_batch_size: 1024
  # Volume control, not correctness: 21.2k of mongo's ~21.3k events per day and 4.4k of
  # qdrant's ~4.5k are connection churn, WiredTiger checkpoints and a client connection
  # probe. Dropped here rather than at the source so `kubectl logs` keeps everything for
  # live debugging, and so the list of what is discarded stays readable. Slow queries, auth
  # events, client metadata and disconnect notices — the ~81/day that can answer a
  # question — all survive. `mongod --quiet` was rejected: it takes the connection pair but
  # not WiredTiger, needs a StatefulSet rollout, strips the lines from `kubectl logs` too,
  # and MongoDB's manual both warns against it in production and declines to enumerate what
  # it suppresses.
  filter/noise:
    # A body that isn't a string, or a regex that can't run, must not take the batch down.
    error_mode: ignore
    logs:
      log_record:
        # Match on mongod's stable numeric message ids, not on `msg` text, which moves
        # between releases. 22943/22944 are NETWORK "Connection accepted"/"Connection ended".
        - 'resource.attributes["k8s.container.name"] == "mongo" and (IsMatch(body, "\"id\":22943,") or IsMatch(body, "\"id\":22944,"))'
        # WiredTiger checkpoint chatter, Informational only — an error out of WTCHKPT is
        # exactly the thing worth keeping. mongod orders its keys `t, s, c, id`, hence `s`
        # before `c`.
        - 'resource.attributes["k8s.container.name"] == "mongo" and IsMatch(body, "\"s\":\"I\",\\s+\"c\":\"WTCHKPT\"")'
        # The qdrant client's connection probe. Anchored on the 200 on purpose: a probe that
        # starts *failing* is the one line from this endpoint you would want to see.
        - 'resource.attributes["k8s.container.name"] == "qdrant" and IsMatch(body, "\"GET /collections HTTP/1.1\" 200")'

exporters:
  otlp_http/axiom:
    # The regional edge domain, not api.axiom.co: against an EU dataset the US default
    # returns `400 ingest is only allowed into datasets in the primary region`.
    # logs_endpoint, not endpoint: `endpoint` appends /v1/logs itself, giving
    # /v1/logs/v1/logs.
    logs_endpoint: https://eu-central-1.aws.edge.axiom.co/v1/logs
    headers:
      Authorization: "Bearer ${env:AXIOM_TOKEN}"
      X-Axiom-Dataset: anchovy-bot-logs
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      storage: file_storage

service:
  extensions: [file_storage, health_check]
  pipelines:
    logs:
      receivers: [file_log]
      # filter/noise sits before k8s_attributes so a dropped record never pays for the
      # informer lookup; resource.attributes["k8s.container.name"] is already populated by
      # then, set by the `container` operator's add_metadata_from_filepath in the receiver.
      processors: [memory_limiter, filter/noise, k8s_attributes, batch]
      exporters: [otlp_http/axiom]
