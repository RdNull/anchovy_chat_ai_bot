# Ships node-level pod logs (bot, mongo, qdrant) to Axiom, so a deploy's `Recreate` no longer
# takes the outgoing pod's log with it — kubelet deletes /var/log/pods/<ns>_<pod>_<uid>/ on pod
# cleanup, and the last real incident (the blanked mongo secret) was diagnosed from a container
# entrypoint stderr line that exists before any application logger runs, which no in-app
# exporter could ever have captured. Node-level via `filelog` is what covers that; a DaemonSet is
# what survives node replacement without thought, even though this cluster has one node today.
#
# Lives in `default`, like everything except blackbox. `k8sattributes` needs cluster-wide read on
# pods/namespaces (core) and replicasets (apps, to resolve a pod back to its Deployment name), so
# the ClusterRole below mirrors dns-sync's — a namespaced Role cannot grant either.
apiVersion: v1
kind: Secret
metadata:
  name: otel-secrets
stringData:
  # Rendered by `envsubst` — see manifests/secrets.yaml for what a value may safely contain. An
  # `xaat-`-prefixed hex token carries none of that round-trip hazard.
  AXIOM_TOKEN: "${AXIOM_TOKEN}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    extensions:
      file_storage:
        directory: /var/lib/otelcol/storage
      # Default endpoint is localhost:13133 — loopback-only inside the container network
      # namespace. kubelet's probes hit the pod IP, not localhost, so the default leaves both
      # probes permanently connection-refused despite the collector itself being healthy.
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      file_log:
        include: [/var/log/pods/*/*/*.log]
        # Without this the collector reads its own log file, and any export error it logs
        # becomes a new line to export. Must match this DaemonSet's pod-name prefix exactly.
        exclude: [/var/log/pods/default_otel-collector-*/*/*.log]
        # Nothing appears until something new is logged — deliberate, so a first start does not
        # ship whatever backlog happens to be sitting on the node. Use `beginning` only for a
        # one-off capture of the node's current buffer.
        start_at: end
        include_file_path: true
        storage: file_storage
        operators:
          # On-disk CRI logs are `<rfc3339> stdout F <message>`, not JSON. This operator parses
          # that, handles the docker variant, reassembles split multiline records, and — with
          # add_metadata_from_filepath — populates the k8s.pod.name / k8s.namespace.name that
          # pod_association below keys on. A hand-rolled regex_parser + recombine pair is the
          # wrong turn here.
          - type: container
            add_metadata_from_filepath: true

    processors:
      memory_limiter:
        check_interval: 1s
        # Below the container's 192Mi limit, so the collector sheds load itself before the
        # kernel OOM-kills it.
        limit_mib: 140
        spike_limit_mib: 30
      k8s_attributes:
        auth_type: serviceAccount
        # Restricts the informer to this node's own pods. On a one-node cluster this changes
        # nothing about correctness, but at a 64Mi request it is resource use worth not paying
        # for, and it is what keeps a future multi-node cluster from making every collector
        # replica watch every pod.
        filter:
          node_from_env_var: KUBE_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.node.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name
      batch:
        timeout: 5s
        send_batch_size: 1024

    exporters:
      otlp_http/axiom:
        # The regional edge domain, not api.axiom.co: against an EU dataset the US default
        # returns `400 ingest is only allowed into datasets in the primary region`.
        # logs_endpoint, not endpoint: `endpoint` appends /v1/logs itself, giving
        # /v1/logs/v1/logs.
        logs_endpoint: https://eu-central-1.aws.edge.axiom.co/v1/logs
        headers:
          Authorization: "Bearer ${env:AXIOM_TOKEN}"
          X-Axiom-Dataset: anchovy-bot-logs
        retry_on_failure:
          enabled: true
        sending_queue:
          enabled: true
          storage: file_storage

    service:
      extensions: [file_storage, health_check]
      pipelines:
        logs:
          receivers: [file_log]
          processors: [memory_limiter, k8s_attributes, batch]
          exporters: [otlp_http/axiom]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          # Pin an explicit version — :latest on this cluster is the exact failure shape the
          # deploy review flagged as P0 elsewhere (image pins on mongo/qdrant).
          image: otel/opentelemetry-collector-contrib:0.160.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol/config.yaml"]
          # The image's default UID (10001) cannot read root-owned /var/log/pods. The failure
          # mode without this is silent — no logs, no crash — which is why it is called out here
          # rather than left to be discovered.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - secretRef:
                name: otel-secrets
          # Requests and a limit, unlike every other container in this cluster (which is
          # requests-only — see manifests/deployment-mongo.yaml). That rule exists because
          # WiredTiger sizes its cache from the cgroup limit, so a mongo limit tight enough to
          # matter OOM-kills mongod; nothing of the sort applies here. A log shipper is the one
          # workload that scales with log volume rather than with traffic this cluster controls,
          # so it is exactly the thing worth capping, with memory_limiter above sitting below
          # the limit so the collector sheds load before the kernel does.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: otel-storage
              mountPath: /var/lib/otelcol/storage
            - name: config
              mountPath: /etc/otelcol
      volumes:
        # containerd writes here; /var/log/containers is only symlinks into it, so mounting
        # that instead would buy nothing.
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: otel-storage
          hostPath:
            path: /var/lib/otelcol/storage
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: otel-collector-config
