# Rendered by `envsubst` in deploy-k8s.sh, into a double-quoted YAML scalar. envsubst makes a
# single pass and never re-scans what it substituted, so a `$` inside a value is safe — but it
# cannot escape a value for YAML. Verified behaviour of each awkward character:
#
#   `$`                  safe, passes through verbatim
#   `"` or a stray `\`   YAML parse error — the deploy fails loudly, which is the good case
#   `\t`, `\n`, `\\`     decoded by the YAML parser; the stored value is SILENTLY wrong
#   a literal newline    folded to a space; also SILENTLY wrong
#
# So: keep secret values to printable characters and no backslashes. Anything else needs a
# path that does not round-trip through YAML.
apiVersion: v1
kind: Secret
metadata:
  name: bot-secrets
stringData:
  MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD}"
  DATABASE_URL: "${DATABASE_URL}"
  TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
  OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
  QDRANT_URL: "${QDRANT_URL}"
  LANGSMITH_API_KEY: "${LANGSMITH_API_KEY}"
