name: anchovy_chat_ai_bot

x-environment-vars: &environment-vars
  TERM: linux

services:
  bot:
    image: anchovy-bot:latest
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      <<: *environment-vars
    env_file:
      - .env
    volumes:
      - .:/proj
    depends_on:
      - mongo
      - qdrant
    command: python -m src.bot
    restart: always
    stdin_open: true
    tty: true

  # Read-only MCP server over the bot's data, the same HTTP server that runs in the
  # cluster, reached by Claude Code through `.mcp.json` at localhost:8765 with the
  # bearer token from `.env.blackbox`. Profile-gated, so a plain `up` never starts it:
  # `docker compose --profile blackbox up -d blackbox`. Published on the loopback only.
  # No `depends_on`: `.env.blackbox` may point it at prod through port-forwards (see
  # README) rather than at the local stores.
  blackbox:
    image: anchovy-blackbox:latest
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        INSTALL_DEV: "true"
    profiles:
      - blackbox
    env_file:
      - path: .env.blackbox
        required: false
    volumes:
      - .:/proj
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:8765:8000
    command: python -m src.blackbox

  mongo:
    image: mongo:8.3.8
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    restart: always
    env_file:
      - .env
    ports:
      - 27019:27017
    volumes:
      - type: volume
        source: shizo_ded_bot
        target: /data/mongo/shizo_ded_bot_db

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    env_file:
      - .env
    volumes:
      - type: volume
        source: qdrant_data
        target: /qdrant/storage

networks:
  default:
    name: shizo_ded_bot

volumes:
  qdrant_data:
    external: true
  shizo_ded_bot:
    external: true