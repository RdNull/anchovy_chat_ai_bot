# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# Learn more about building a configuration: https://promptfoo.dev/docs/configuration/guide
# TODO: rework this eval

description: "Image description eval"

prompts:
  - id: file://chat_prompt.json
    label: "Prompt-v1"

providers:
  - file://../models/cloud/image_describe/v2.yaml

defaultTest:
  options:
    transform: |
      let parsed = JSON.parse(output.replace(/```json|```/g, '').trim())
      parsed.ocr_text = parsed.ocr_text.length ? parsed.ocr_text : '<empty>'
      return parsed
    provider:
      embedding:
        # OpenRouter has an OpenAI-compatible /v1/embeddings, but promptfoo's
        # `openrouter:` provider is chat-only, so point the openai one at it.
        id: openai:embeddings:openai/text-embedding-3-small
        config:
          apiBaseUrl: https://openrouter.ai/api/v1
          apiKeyEnvar: OPENROUTER_API_KEY
  vars:
    prompt: file://../../src/prompts/image_describe/v1.j2

  assert:
    # json format
    - type: contains-json
      value:
        required:
          - description
          - ocr_text
        type: object

    # Keywords present
    - type: icontains-all
      metric: keyword_coverage
      value: '{{expected.keywords}}'

    #similarity
    - type: similar
      metric: similarity
      transform: output.description
      value: '{{expected.description}}'
      threshold: 0.8

    - type: similar
      metric: similarity
      transform: output.ocr_text
      value: '{{expected.ocr_text}}'
      threshold: 0.9

tests:
  - description: "simple_image"
    vars:
      image: file://images/simple_image.jpg
      expected:
        keywords: [ "костюм", "офис" ]
        ocr_text: "инвестировал в говно"
        description: "Мем с Генри Кавиллом в деловом костюме в офисе. Ироничное высказывание о неудачных финансовых вложениях."

  - description: "screenshot"
    vars:
      image: file://images/screenshot.jpg
      expected:
        keywords: [ "анчоусы", "кентубас", "лоу-таб" ]
        ocr_text: "22:31 Анчоусы 11 members Pinned Message бля че го по 2 часа в день и бимбимбамб... Ален Ищанов @GuldenToktassyn а у тебя фронт... Э 10:40 Ален Ищанов @GuldenToktassyn а у тебя фронтов и... Лоу-таб эт чё такое? 10:41 Ален Ищанов кентубасик Bekniyaz Zhumagulov Э У меня кентубас работу ищет 10:41 Bekniyaz Zhumagulov 0 прикинь Да ну нах 10:41 Anton Luboshnikov Лоу-таб эт чё такое? Ну типа слабый 10:41 Ален Ищанов У меня кентубас работу ищет Ты про меня что ли? 10:41"
        description: "Скриншот переписки в Telegram-чате «Анчоусы», где участники обсуждают поиск работы и значение термина «лоу-таб»"


  - description: "no_text"
    vars:
      image: file://images/cat.png
      expected:
        keywords: [ "кот", "язык" ]
        ocr_text: "<empty>"
        description: "Крупный план морды кота с широко открытыми глазами и высунутым языком, рядом эмодзи жеста шака"

  - description: "meme_1"
    vars:
      image: file://images/meme_1.jpg
      expected:
        keywords: [ "мужчин", "плечо" ]
        ocr_text: "<empty>"
        description: "Кадр из аниме, где двое мужчин с ухмылками кладут руку на плечо третьему человеку. Мем 'Двое парней с широкими подбородками'"