# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Rubric-free gesture probe: does the character reach for a reaction on the six
# real gesture fixtures, without a judge flattening the channel choice the way
# the production rubrics in promptfooconfig.yaml do. Distinct filename on purpose
# (see evals/CLAUDE.md "When the production rubrics can't answer the question") -
# invisible to `-c ./reply/characters`, no unwiring needed. Kept in the repo
# because stage 2 (stickers, spec 020) reuses it.

description: "Elzhan gesture probe (no asserts)"

prompts:
  - id: file://../prompts/v11.js
    label: "Character v11"

providers:
  - id: file://../../models/chat/v8-gemini.yaml

defaultTest:
  vars:
    character_description: file://character.js
    bot_nickname: AnchovyAiBot

tests:
  # gesture-class
  - description: "disbelief_check"
    vars:
      messages: file://disbelief_check/messages.json

  - description: "mockery_own_lie"
    vars:
      messages: file://mockery_own_lie/messages.json

  - description: "peer_agreement"
    vars:
      messages: file://peer_agreement/messages.json

  - description: "secondhand_pain"
    vars:
      messages: file://secondhand_pain/messages.json

  # text-required
  - description: "factual_combo_followup"
    vars:
      messages: file://factual_combo_followup/messages.json

  - description: "factual_fitness_pushback"
    vars:
      messages: file://factual_fitness_pushback/messages.json

  # sticker-class
  - description: "sticker_obvious_punchline"
    vars:
      messages: file://sticker_obvious_punchline/messages.json

  - description: "sticker_rant"
    vars:
      messages: file://sticker_rant/messages.json

  # sticker-negative: a search is fine, a send is not (the corpus returns [])
  - description: "sticker_no_match"
    vars:
      messages: file://sticker_no_match/messages.json
