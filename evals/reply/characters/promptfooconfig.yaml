# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: "Character response eval"

prompts:
  - id: file://../prompts/v9.js
    label: "Character v9"

providers:
  - id: file://../../models/chat/v8-gemini.yaml

defaultTest:
  vars:
    character_description: file://whyzzzy.js
  assert:
    # response must be between 1 and 20 words long
    - type: word-count
      value:
        min: 1
        max: 20
    # no special characters allowed in the response
    - type: not-regex
      value: "[\\[\\]{}|\\\/<>#$&*]"

    - type: llm-rubric
      metric: personality
      provider:
        id: openrouter:openai/gpt-5-mini
        config:
          temperature: 0.2
          response_format: { type: "json_object" }
      value: |
        The reply can be a gesture instead of text:
        - `REACTION:<emoji>` - the bot put a reaction on the message
        - `STICKER:<id>` - the bot replied with a sticker (the id is opaque, don't judge it)
        These are full-fledged replies, not a refusal to answer. If it's a gesture, judge
        the choice itself (is it in character), not the absence of text.

        Given this character:
        {{character_description}}

        Does the reply follow the character personality?

    - type: llm-rubric
      metric: personality
      provider:
        id: openrouter:openai/gpt-5-mini
        config:
          temperature: 0.2
          response_format: { type: "json_object" }
      value: |
        The reply can be a gesture instead of text:
        - `REACTION:<emoji>` - the bot put a reaction on the message
        - `STICKER:<id>` - the bot replied with a sticker (the id is opaque, don't judge it)
        These are full-fledged replies, not a refusal to answer. A gesture carries no
        language level of its own - pass it, unless the gesture itself is out of bounds
        for the character.

        Given this character:
        {{character_description}}

        Is the toxicity and language level consistent with what's described for this character?
        Not too soft, not beyond what the character allows.

    - type: llm-rubric
      metric: reaction-fit
      provider:
        id: openrouter:openai/gpt-5-mini
        config:
          temperature: 0.2
          response_format: { type: "json_object" }
      value: |
        The reply can be a gesture instead of text:
        - `REACTION:<emoji>` - the bot put a reaction on the message
        - `STICKER:<id>` - the bot replied with a sticker (the id is opaque, don't judge it)
        These are full-fledged replies, not a refusal to answer. The criterion below is
        unchanged: a reaction or sticker that fits the last message counts as reacting to it.

        You are scoring ONE chat reply against the conversation it follows.

        Transcript (oldest to newest):
        {{messages}}
        
        Score ONE thing only: did the reply react to the LAST message in the transcript?
          
        "React to the last message" means:
          - If the last message has real content (a question, claim, story, or jab), the
            reply engages THAT content. Agreeing, answering, dismissing, mocking, or
            refusing all count. The reply does NOT have to be helpful, polite, or
            cooperative — a rude or flat dismissal is a valid reaction.
          - If the last message is low-content (a bare summon / mention: "ping", "эй бот",
            just a name, "hey"), it is asking the bot to react to the recent context. So
            reacting to the recent context counts. Do NOT require the reply to address the
            summon itself.
        
        Fail (0.0) if either:
          1. The reply ignores what the last message calls for — e.g. the last message has
          real content but the reply only continues an older topic or drops a fact/detail
          the last message and recent context never raised.
          2. The reply reacts, but bolts on a detachable piece about something the last 
          message and recent context did not raise. Test: remove that piece — if a
          complete reaction to the last message still remains, the piece was bolted on.
          
        Otherwise pass (1.0).
        
        Do NOT score whether the reply is funny, clever, helpful, or kind — only whether
        it reacts to the last message as defined above.

    # A bare REACTION:/STICKER: answer is scored as a neutral pass here, not on
    # "would someone reply" - a reaction is *intended* to close a beat rather than
    # bait one, so grading it by this rubric's own criterion would re-create the
    # exact bias this task exists to remove (it would always lose to a closed
    # punchline scored the same way this rubric already penalizes).
    - type: llm-rubric
      metric: baitability
      provider:
        id: openrouter:openai/gpt-5-mini
        config:
          temperature: 0.2
          response_format: { type: "json_object" }
      value: |
        The reply can be a gesture instead of text:
        - `REACTION:<emoji>` - the bot put a reaction on the message
        - `STICKER:<id>` - the bot replied with a sticker (the id is opaque, don't judge it)
        These are full-fledged replies, not a refusal to answer. A gesture can't be judged
        by the criterion below (the id is opaque, a reaction isn't text) - give any gesture
        a neutral pass (0.5), not 0.0.

        This is a group chat where people bait each other into replying.
        
        Score ONE thing: would a real chat member bother to respond to this —
        reply, dunk, or slap a reaction on it?
        
        A baitable line is confident and slightly provocative and leaves a
        thread to pull. A line that resolves itself completely — a closed,
        bow-tied punchline — kills the volley and scores LOWER even if it's
        clever. Open and pokeable beats clever and final.
        
        - 1.0: plants a flag that demands a comeback; you can't not respond
        - 0.5: fine, but easy to scroll past
        - 0.0: dead end — over-explained, self-contained, or so off that no
          one engages; or breaks frame to deflect ("я же бот, так что…")

        Last messages:
        {{messages}}

    - type: llm-rubric
      metric: delivery
      provider:
        id: openrouter:openai/gpt-5-mini
        config:
          temperature: 0.2
          response_format: { type: "json_object" }
      value: |
        The reply can be a gesture instead of text:
        - `REACTION:<emoji>` - the bot put a reaction on the message
        - `STICKER:<id>` - the bot replied with a sticker (the id is opaque, don't judge it)
        These are full-fledged replies, not a refusal to answer. A gesture trivially
        satisfies all three points below (nothing to cut off, nothing to explain, it's
        one single action) - score it full marks (1.0).

        Given this character:
        {{character_description}}

        Score the DELIVERY mechanics only (not whether it's funny or relevant):
        - Does it stop at the right moment instead of over-extending?
        - Does it avoid explaining its own joke?
        - Is it one clean beat, not stitched-together clauses?
        
        Score each 0 to 1, return the average.

tests:
  - description: "basic"
    vars:
      messages: file://basic/messages.json

  - description: "chaos_injection_reaction"
    vars:
      messages: file://chaos_injection_reaction/messages.json

  - description: "language_mix_and_typos"
    vars:
      messages: file://language_mix_and_typos/messages.json

  - description: "random_injection_low_context"
    vars:
      messages: file://random_injection_low_context/messages.json

  - description: "topic_change"
    vars:
      messages: file://topic_change/messages.json

  - description: "toxic_joke"
    vars:
      messages: file://toxic_joke/messages.json

  - description: "image_explain_real"
    vars:
      messages: file://image_explain_real/messages.json

  - description: "crime-assignment"
    vars:
      messages: file://crime-assignment/messages.json

  - description: "word_play"
    vars:
      messages: file://word_play/messages.json

  # A fact that is live by definition — no model can hold today's rate, so this
  # measures one thing only: does the tool fire when the answer is unreachable.
  - description: "web_search_factual"
    vars:
      messages: file://web_search_factual/messages.json
    assert:
      - type: javascript
        metric: tool-choice
        value: "(context.metadata?.toolsCalled || []).includes('search_web')"

  # KNOWN RED, on purpose. Same assert, harder property: the answer is reachable
  # only if the model notices its own belief is stale. gemini-3.7-flash does not —
  # it bluffs «он еще даже не вышел» about a phone out since 2025-09. Kept as a
  # standing probe of the gap search_web exists to close; a pass here is a real
  # improvement, not a flake.
  - description: "web_search_stale_belief"
    vars:
      messages: file://web_search_stale_belief/messages.json
    assert:
      - type: javascript
        metric: tool-choice
        value: "(context.metadata?.toolsCalled || []).includes('search_web')"

  # The answer is two messages up: searching the web for it is the failure.
  - description: "web_search_not_needed"
    vars:
      messages: file://web_search_not_needed/messages.json
    assert:
      - type: javascript
        metric: tool-choice
        value: "!(context.metadata?.toolsCalled || []).includes('search_web')"

  # The callback returns a wall of prose; `word-count max: 20` catches a paste.
  - description: "web_search_recitation"
    vars:
      messages: file://web_search_recitation/messages.json

  # The callback returns `не нашлось` — the one state every search can end in.
  - description: "web_search_empty"
    vars:
      messages: file://web_search_empty/messages.json

  # A landed joke that needs no addition - a reaction or sticker closes it.
  - description: "gesture_closed_joke"
    vars:
      messages: file://gesture_closed_joke/messages.json
    assert:
      - type: javascript
        metric: channel-choice
        value: "['set_reaction', 'send_sticker'].some(t => (context.metadata?.toolsCalled || []).includes(t))"

  # Caught contradicting themselves mid-conversation - a reaction, not more words.
  - description: "gesture_caught_out"
    vars:
      messages: file://gesture_caught_out/messages.json
    assert:
      - type: javascript
        metric: channel-choice
        value: "(context.metadata?.toolsCalled || []).includes('set_reaction')"

  # The setup is the "жаба" corpus sticker's own joke (asked to hold something,
  # it keeps dragging on) - a fixture case with a real punchline sticker available.
  - description: "sticker_obvious_punchline"
    vars:
      messages: file://sticker_obvious_punchline/messages.json
    assert:
      - type: javascript
        metric: channel-choice
        value: "(context.metadata?.toolsCalled || []).includes('send_sticker')"

  # Bureaucracy talk that find_stickers' reserved branch always misses on - exercises
  # the «пустой список → отвечай текстом» path the tool description depends on.
  - description: "sticker_no_match"
    vars:
      messages: file://sticker_no_match/messages.json
    assert:
      - type: javascript
        metric: channel-choice
        value: "(context.metadata?.toolsCalled || []).includes('find_stickers') && (context.metadata?.toolsCalled || []).includes('answer_text')"

  # Regression guard: a direct question needing a real answer should still get text,
  # so this task doesn't over-rotate the suite toward gestures.
  - description: "text_still_wins"
    vars:
      messages: file://text_still_wins/messages.json
    assert:
      - type: javascript
        metric: channel-choice
        value: "(context.metadata?.toolsCalled || []).includes('answer_text')"