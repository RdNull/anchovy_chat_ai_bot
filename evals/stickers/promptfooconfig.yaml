# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: "Sticker describer eval: does the meaning come through"

prompts:
  - id: file://chat_prompt.js:stickerV2
    label: "sticker-v2"

providers:
  - file://../models/image_describe/v2.yaml
  - file://../models/image_describe/gemini-3.8-flash.yaml
  - file://../models/image_describe/gpt-6-luna.yaml
  - file://../models/image_describe/glm-5.3-flash.yaml
  - file://../models/image_describe/qwen3.8-flash.yaml

tests: file://load_cases.js

defaultTest:
  options:
    # Never throws: an unparseable output must reach `not_blocked` and fail it there.
    transform: |
      try {
        return JSON.parse(output.replace(/```json|```/g, '').trim())
      } catch (e) {
        return { unparsed: String(output) }
      }
  assert:
    - type: javascript
      metric: blocked
      value: |
        const d = output && output.description
        if (typeof d !== 'string' || d.trim() === '') return { pass: false, score: 0, reason: 'empty or unparseable output' }
        if (d.trim().toLowerCase() === 'nsfw content') return { pass: false, score: 0, reason: 'placeholder: nsfw content' }
        return { pass: true, score: 1, reason: 'described' }

    - type: llm-rubric
      metric: meaning
      # A judge reply with a score but no `pass` field is otherwise taken as a pass.
      threshold: 0.5
      provider:
        id: openrouter:openai/gpt-5-mini
        config:
          temperature: 0.2
          response_format: { type: "json_object" }
      value: |
        You grade a description of a Telegram sticker. The describer saw the sticker and
        wrote the text below (description + ocr_text). You do NOT see the sticker; judge only
        whether the text carries the meaning listed here.

        Meaning that MUST come through (every point):
        {{must}}
        {% if bonus %}
        Bonus (not required):
        {{bonus}}
        {% endif %}
        {% if must_not %}
        Must NOT happen (case-specific):
        {{must_not}}
        {% endif %}
        Must NOT happen (always):
        - a placeholder instead of a description (e.g. "nsfw content");
        - refusal, moralising, or softening sex/violence into vague words;
        - clothing as the main content for photos of people;
        - a confident but wrong meme name or meaning.

        Grading:
        - pass = every MUST point comes through (wording may differ) and no must-not is hit;
        - score 1.0 = pass and the bonus comes through{% if not bonus %} (no bonus for this case: any pass is 1.0){% endif %};
        - score 0.5 = pass without the bonus;
        - score 0 = fail.
        Return JSON with keys in this order: "reason" (one sentence: which MUST point is
        missing or which must-not is hit, or that all MUST points are present), "pass"
        (boolean), "score" (number).
