# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: "Initiative judge - stage 1 model selection"

prompts:
  - id: file://../../src/prompts/initiative/v1.j2
    label: "initiative v1"

providers:
  - file://../models/initiative/glm-5.3-flash-low.yaml
  - file://../models/initiative/gemini-3.8-flash-low.yaml

defaultTest:
  vars:
    character_description: file://_shared/character.js
    current_memory: file://_shared/memory.txt
    # Anonymised tagged form, matching production's <BOT_NICKNAME>[<code>].
    bot_nickname: ChatBot[whyzzzy]

  assert:
    # Production uses with_structured_output; this eval sends a plain call, so a
    # failure here means "needs response_format", not "cannot judge".
    - type: is-json
      metric: schema_ok
    - type: javascript
      metric: schema_ok
      value: |
        if (!output) return false;
        const r = typeof output === 'string' ? JSON.parse(output) : output;
        return typeof r.score === 'number' && r.score >= 0 && r.score <= 1
          && (r.target_index === null || Number.isInteger(r.target_index))
          && typeof r.reason === 'string' && r.reason.length > 0;
    - type: javascript
      metric: reason_terse
      value: |
        if (!output) return false;
        const r = typeof output === 'string' ? JSON.parse(output) : output;
        return r.reason.length <= 120;

# The metric that decides stage 1. good 0.9 / bad 0.7 is usable (threshold 0.8);
# good 0.65 / bad 0.60 is not. Do not rank on score_good alone.
derivedMetrics:
  - name: separation
    value: score_good - score_bad

tests:
  # ---------- should speak ----------
  - description: "unpunched_setup - absurd claim, chat moved on (target is NOT last)"
    vars:
      messages: file://unpunched_setup/messages.txt
    assert:
      - type: javascript
        metric: score_good
        value: |
          if (!output) return { pass: false, score: 0, reason: 'no response' };
          const s = (typeof output === 'string' ? JSON.parse(output) : output).score;
          return { pass: s >= 0.6, score: s, reason: `score=${s}` };
      - type: javascript
        metric: target_hit
        value: |
          (typeof output === 'string' ? JSON.parse(output) : output).target_index === 3

  # #10 accepted: a confident claim with a hole in it; target distance is tested by the real_* fixtures.
  - description: "brag_to_puncture - boast with a hole in it"
    vars:
      messages: file://brag_to_puncture/messages.txt
    assert:
      - type: javascript
        metric: score_good
        value: |
          if (!output) return { pass: false, score: 0, reason: 'no response' };
          const s = (typeof output === 'string' ? JSON.parse(output) : output).score;
          return { pass: s >= 0.6, score: s, reason: `score=${s}` };
      - type: javascript
        metric: target_hit
        value: "[4, 5, 10].includes((typeof output === 'string' ? JSON.parse(output) : output).target_index)"


  # ---------- should stay quiet ----------
  # Was labelled "should speak"; relabelled 26-09-10. Generic Monday grumbling with no
  # hook - the models reject it near-unanimously and they are right.
  - description: "no_single_hook - general grumbling, nothing to grab"
    vars:
      messages: file://no_single_hook/messages.txt
    assert:
      - type: javascript
        metric: score_bad
        value: |
          if (!output) return { pass: false, score: 0, reason: 'no response' };
          const s = (typeof output === 'string' ? JSON.parse(output) : output).score;
          return { pass: s <= 0.4, score: s, reason: `score=${s}` };
      - type: javascript
        metric: target_hit
        value: |
          (typeof output === 'string' ? JSON.parse(output) : output).target_index === null

  - description: "coordination - time, place, money"
    vars:
      messages: file://coordination/messages.txt
