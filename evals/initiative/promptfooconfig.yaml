        metric: score_bad
        value: |
          if (!output) return { pass: false, score: 0, reason: 'no response' };
          const s = (typeof output === 'string' ? JSON.parse(output) : output).score;
          return { pass: s <= 0.3, score: s, reason: `score=${s}` };

  # ---------- real windows (blackbox, ground truth = reactions on the bot's reply) ----------

  # 26-09-04. The bot answered #10 and drew 🤣 ×6, its best-reacted message on record.
