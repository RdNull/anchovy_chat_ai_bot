  # sticker that dodges it (#10 in real_sticker_dodge).
  - description: "real_question_pending - unanswered question to the room"
    vars:
      messages: file://real_question_pending/messages.txt
    assert:
      - type: javascript
        metric: score_good
        value: |
          if (!output) return { pass: false, score: 0, reason: 'no response' };
          const s = (typeof output === 'string' ? JSON.parse(output) : output).score;
          return { pass: s >= 0.6, score: s, reason: `score=${s}` };
      - type: javascript
        metric: target_hit
        value: |
          if (!output) return false;
          const r = typeof output === 'string' ? JSON.parse(output) : output;
          return r.target_index === 9;

  # ---------- real windows, target labels (spec 007) ----------
  # Windows rebuilt from blackbox at claim time, collapsed and rendered as production does;
