          const s = (typeof output === 'string' ? JSON.parse(output) : output).score;
          return { pass: s <= 0.4, score: s, reason: `score=${s}` };

  - description: "thread_closing - ok, dogovorilis"
    vars:
      messages: file://thread_closing/messages.txt
    assert:
      - type: javascript
        metric: score_bad
        value: |
          if (!output) return { pass: false, score: 0, reason: 'no response' };
          const s = (typeof output === 'string' ? JSON.parse(output) : output).score;
          return { pass: s <= 0.4, score: s, reason: `score=${s}` };

  - description: "bot_spoke_last - its own message is newest"
    vars:
      messages: file://bot_spoke_last/messages.txt
